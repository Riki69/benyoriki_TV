name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Opsional: pakai keystore sendiri dari GitHub Secrets (lihat README).
      - name: Siapkan keystore dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK release
        run: >
          gradle assembleRelease --no-daemon
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
          -PgithubRepo=${{ github.repository }}

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk benyoriki-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: benyoriki-apk
          path: benyoriki-${{ github.run_number }}.apk

      # Rilis bertag "build-<nomor>" -> dibaca aplikasi untuk update otomatis
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Benyoriki 1.0.${{ github.run_number }}
          body: Pembaruan otomatis build ${{ github.run_number }}.
          files: benyoriki-${{ github.run_number }}.apk
          make_latest: true
