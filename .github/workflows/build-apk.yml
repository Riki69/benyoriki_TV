name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pastikan file Gradle tingkat-root benar (build.gradle root HARUS berbeda dari app/build.gradle).
      - name: Pastikan file Gradle root benar
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BenyorikiTV"
          include ':app'
          EOF
          printf 'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n' > gradle.properties
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          // Diisi oleh GitHub Actions (-PversionCode=<run_number> dst.); default untuk build lokal.
          def appVersionCode = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
          def appVersionName = (project.findProperty('versionName') ?: '1.0.0').toString()
          // "pemilik/repo" GitHub tempat APK dirilis (dipakai untuk cek update otomatis)
          def appGithubRepo = (project.findProperty('githubRepo') ?: 'OWNER/REPO').toString()

          def ksPath = System.getenv('KEYSTORE_PATH') ?: '../keystore/release.jks'
          def ksPass = System.getenv('KEYSTORE_PASSWORD') ?: 'benyoriki123'
          def ksAlias = System.getenv('KEY_ALIAS') ?: 'benyoriki'
          def ksKeyPass = System.getenv('KEY_PASSWORD') ?: 'benyoriki123'

          android {
              namespace = 'com.benyoriki.app'
              compileSdk = 34

              defaultConfig {
                  applicationId = 'com.benyoriki.app'
                  minSdk = 23
                  targetSdk = 34
                  versionCode = appVersionCode
                  versionName = appVersionName
                  buildConfigField 'String', 'GITHUB_REPO', "\"${appGithubRepo}\""
                  buildConfigField 'String', 'SITE_URL', '"https://benyoriki.com/"'
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }

              buildFeatures {
                  buildConfig = true
              }

              signingConfigs {
                  release {
                      // Kunci tetap supaya APK baru bisa menimpa (update) APK lama.
                      storeFile = file(ksPath)
                      storePassword = ksPass
                      keyAlias = ksAlias
                      keyPassword = ksKeyPass
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled = false
                      signingConfig = signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF
          test -f app/src/main/AndroidManifest.xml || { echo "ERROR: folder app/src/main tidak lengkap di repo. Upload ulang seluruh isi zip proyek (termasuk folder app)."; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; }
          test -f app/src/main/java/com/benyoriki/app/MainActivity.java || { echo "ERROR: MainActivity.java tidak ada"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Runner sudah berisi Android SDK. Terima lisensi dengan menulis file lisensi langsung
      # (tidak bergantung pada sdkmanager yang bisa gagal).
      - name: Siapkan Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # Keystore: dari Secrets bila ada; jika file keystore/release.jks tidak ikut ter-upload, buat otomatis.
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          elif [ ! -f keystore/release.jks ]; then
            echo "keystore/release.jks tidak ditemukan -> membuat otomatis"
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/release.jks -alias benyoriki -keyalg RSA -keysize 2048 \
              -validity 36500 -storepass benyoriki123 -keypass benyoriki123 -dname "CN=Benyoriki, O=Benyoriki, C=ID"
          fi
          ls -la keystore || true

      - name: Build APK release
        run: |
          gradle assembleRelease --no-daemon --stacktrace --console=plain \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/release/app-release.apk benyoriki-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: benyoriki-apk
          path: benyoriki-${{ github.run_number }}.apk

      # Rilis bertag "build-<nomor>" -> dibaca aplikasi untuk update otomatis
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Benyoriki 1.0.${{ github.run_number }}
          body: Pembaruan otomatis build ${{ github.run_number }}.
          files: benyoriki-${{ github.run_number }}.apk
          make_latest: true
